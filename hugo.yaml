baseURL: https://blog.jeromesoyer.fr/
title: The Least Privilege Life
theme: ["PaperMod"]
paginate: 10

defaultContentLanguage: en
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "EN"
    weight: 1
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 30
        - identifier: uses
          name: Uses
          url: /uses/
          weight: 40
        - identifier: search
          name: Search
          url: /search/
          weight: 50
    params:
      homeInfoParams:
        Title: "Hi, I'm Jerome."
        Content: >
          VP Sales Engineering @Varonis by day — so yes, I know what bad opsec looks like.
          Compulsive automator, dotfiles nerd, and builder of tools nobody asked for.
          Apple fanboy, tech enthusiast, crypto and economics watcher.
          Suit during the week, hoodie and sneakers on weekends. Wine, racing, running, and terminals the rest of the time.
          Gamer in theory, not in practice — the backlog is real.
          This is my nerdy corner of the internet — expect anything.

  fr:
    languageName: "FR"
    weight: 2
    menu:
      main:
        - identifier: posts
          name: Articles
          url: /fr/posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /fr/tags/
          weight: 20
        - identifier: about
          name: À propos
          url: /fr/about/
          weight: 30
        - identifier: uses
          name: Outils
          url: /fr/uses/
          weight: 40
        - identifier: search
          name: Recherche
          url: /fr/search/
          weight: 50
    params:
      homeInfoParams:
        Title: "Salut, je suis Jerome."
        Content: >
          VP Sales Engineering @Varonis le jour — donc oui, je sais à quoi ressemble une mauvaise opsec.
          Automatiseur compulsif, fana des dotfiles, et constructeur d'outils que personne n'a demandés.
          Apple fanboy, passionné de tech, observateur de crypto et d'économie.
          Costume en semaine, hoodie et sneakers le week-end. Vin, racing, running, et terminaux le reste du temps.
          Gamer en théorie, pas en pratique — la backlog est réelle.
          C'est mon coin nerd sur internet — attendez-vous à tout.

params:
  env: production
  author: Jerome Soyer
  description: "A blog about developer tools, automation, and the least privilege you actually need."
  keywords: [devops, dotfiles, terminal, automation, linux, macos, cli]

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  ShowRelatedPosts: true
  RelatedPostsCount: 3
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg

  label:
    text: "The Least Privilege Life"
    icon: /favicon.svg
    iconHeight: 35

  profileMode:
    enabled: false

  socialIcons:
    - name: github
      url: "https://github.com/jsoyer"
    - name: twitter
      url: "https://twitter.com/JeromeSoyer"
    - name: linkedin
      url: "https://www.linkedin.com/in/jeromesoyer/"

  images:
    - /og-default.png

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/jsoyer/blog.jeromesoyer.fr/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula
