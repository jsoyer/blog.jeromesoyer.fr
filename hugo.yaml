baseURL: https://blog.jeromesoyer.fr/
title: The Least Privilege Life
theme: ["PaperMod"]
paginate: 10

defaultContentLanguage: en
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "EN"
    weight: 1
    menu:
      main:
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 30
        - identifier: uses
          name: Uses
          url: /uses/
          weight: 40
        - identifier: search
          name: Search
          url: /search/
          weight: 50
    params:
      homeInfoParams:
        Title: "Hey, I'm Jerome"
        Content: >
          Developer obsessed with clean tooling, reproducible environments, and
          automation that makes future-you grateful. I write about dotfiles,
          terminals, CLI tools — the things I actually use every day.

  fr:
    languageName: "FR"
    weight: 2
    menu:
      main:
        - identifier: posts
          name: Articles
          url: /fr/posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /fr/tags/
          weight: 20
        - identifier: about
          name: À propos
          url: /fr/about/
          weight: 30
        - identifier: uses
          name: Outils
          url: /fr/uses/
          weight: 40
        - identifier: search
          name: Recherche
          url: /fr/search/
          weight: 50
    params:
      homeInfoParams:
        Title: "Salut, je suis Jerome"
        Content: >
          Développeur passionné par les environnements bien configurés,
          l'automatisation et les outils CLI. J'écris sur les dotfiles,
          les terminaux et tout ce que j'utilise vraiment au quotidien.

params:
  env: production
  author: Jerome Soyer
  description: "A blog about developer tools, automation, and the least privilege you actually need."
  keywords: [devops, dotfiles, terminal, automation, linux, macos, cli]

  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true
    favicon: /favicon.svg
    favicon16x16: /favicon.svg
    favicon32x32: /favicon.svg
    apple_touch_icon: /favicon.svg
    safari_pinned_tab: /favicon.svg

  label:
    text: "The Least Privilege Life"
    icon: /favicon.svg
    iconHeight: 35

  profileMode:
    enabled: false

  socialIcons:
    - name: github
      url: "https://github.com/jsoyer"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/jsoyer/blog.jeromesoyer.fr/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: true
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: dracula
