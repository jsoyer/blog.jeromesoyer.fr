<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1e1e2e"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#313244" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#a6e3a1"/>

  <!-- Terminal prompt -->
  <text x="80" y="220" font-family="monospace" font-size="28" fill="#a6adc8" opacity="0.6">~/blog $</text>

  <!-- Blog title -->
  <text x="80" y="320" font-family="monospace" font-size="64" font-weight="bold" fill="#cdd6f4">The Least</text>
  <text x="80" y="400" font-family="monospace" font-size="64" font-weight="bold" fill="#cdd6f4">Privilege <tspan fill="#a6e3a1">Life</tspan></text>

  <!-- Tagline -->
  <text x="80" y="470" font-family="monospace" font-size="22" fill="#6c7086">blog.jeromesoyer.fr</text>

  <!-- Decorative dots top-right -->
  <circle cx="1100" cy="120" r="80" fill="#313244" opacity="0.4"/>
  <circle cx="1100" cy="120" r="50" fill="#45475a" opacity="0.3"/>
  <circle cx="1100" cy="120" r="20" fill="#a6e3a1" opacity="0.6"/>
</svg>
