{{- if eq (getenv "HUGO_ENV") "production" | or (eq .Site.Params.env "production") }}
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "63ad8e33c61f4b9cb899e75292adc341"}'></script>
{{- end }}

{{- if and .IsHome (eq .Lang "en") }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
{{- end }}

{{/* Performance: preconnect for external resources */}}
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://static.cloudflareinsights.com">

{{/* Preload critical fonts */}}
<link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/jetbrains-mono-variable.woff2" as="font" type="font/woff2" crossorigin>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Reading progress bar — only on article pages
  if (document.querySelector('.post-content')) {
    var bar = document.createElement('div');
    bar.id = 'reading-progress';
    document.body.prepend(bar);

    function updateProgress() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? scrollTop / docHeight : 0;
      bar.style.setProperty('--scroll-progress', progress);
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();
  }

  // Mermaid — lazy load only when mermaid blocks are present
  var mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
  if (mermaidBlocks.length > 0) {
    mermaidBlocks.forEach(function (block) {
      var pre = block.parentElement;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = block.textContent;
      pre.parentNode.replaceChild(div, pre);
    });
    var isDark = document.body.classList.contains('dark');
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    script.onload = function () {
      mermaid.initialize({
        startOnLoad: true,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose'
      });
    };
    document.head.appendChild(script);
  }
});
</script>
